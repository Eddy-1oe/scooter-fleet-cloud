<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scooter Fleet</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f0f0f;
    color: #ffffff;
    min-height: 100vh;
    padding: 16px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #2a2a2a;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #185FA5;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #E6F1FB;
    font-size: 18px;
  }
  .brand-name {
    font-size: 16px;
    font-weight: 500;
    color: #ffffff;
  }
  .brand-sub {
    font-size: 12px;
    color: #666666;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #666666;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1D9E75;
  }
  .status-dot.offline {
    background: #E24B4A;
  }
  h1 {
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    color: #888888;
    margin-bottom: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .fleet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .scooter-card {
    background: #1a1a1a;
    border-radius: 20px;
    padding: 20px;
    border: 1px solid #2a2a2a;
  }
  .scooter-card.offline {
    opacity: 0.5;
    border-color: #ff444433;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .scooter-id {
    font-size: 18px;
    font-weight: 600;
  }
  .status-badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .status-badge.online {
    background: #44ff8822;
    color: #44ff88;
  }
  .status-badge.offline {
    background: #ff444422;
    color: #ff4444;
  }
  .telemetry-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .tel-item {
    text-align: center;
  }
  .tel-label {
    font-size: 10px;
    color: #666666;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .tel-value {
    font-size: 20px;
    font-weight: 600;
  }
  .tel-unit {
    font-size: 10px;
    color: #444444;
  }
  .tel-value.green  { color: #44ff88; }
  .tel-value.yellow { color: #ffcc00; }
  .tel-value.red    { color: #ff4444; }
  .tel-value.blue   { color: #44aaff; }
  .tel-value.white  { color: #ffffff; }

  .battery-bar {
    width: 100%;
    height: 6px;
    background: #2a2a2a;
    border-radius: 3px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .battery-fill {
    height: 100%;
    transition: width 0.5s ease;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .btn {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 12px 8px;
    color: #ffffff;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.1s;
  }
  .btn:active { transform: scale(0.95); }
  .btn.full { grid-column: span 2; }
  .btn.danger  { border-color: #ff444466; color: #ff4444; }
  .btn.success { border-color: #44ff8866; color: #44ff88; }
  .btn.blue    { border-color: #44aaff66; color: #44aaff; }
  .btn.yellow  { border-color: #ffcc0066; color: #ffcc00; }
  .btn-icon { font-size: 16px; margin-bottom: 4px; }

  .btn.active-green  { background: #44ff8822; border-color: #44ff88; color: #44ff88; }
  .btn.active-red    { background: #ff444422; border-color: #ff4444; color: #ff4444; }
  .btn.active-yellow { background: #ffcc0022; border-color: #ffcc00; color: #ffcc00; }

  .last-seen {
    text-align: center;
    font-size: 10px;
    color: #333333;
    margin-top: 12px;
  }
  .no-scooters {
    text-align: center;
    color: #333333;
    font-size: 14px;
    margin-top: 60px;
  }
  .summary-section {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .summary-card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 16px;
    border: 1px solid #2a2a2a;
  }
  .summary-label {
    font-size: 11px;
    color: #666666;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .summary-value {
    font-size: 24px;
    font-weight: 600;
    color: #ffffff;
  }
  .chart-section {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 16px;
    border: 1px solid #2a2a2a;
    margin-bottom: 24px;
  }
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .chart-title {
    font-size: 14px;
    font-weight: 500;
    color: #ffffff;
  }
  .history-section {
    margin-top: 16px;
    border-top: 1px solid #2a2a2a;
    padding-top: 12px;
  }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .history-title {
    font-size: 11px;
    color: #666666;
    text-transform: uppercase;
  }
  .history-toggle {
    background: none;
    border: none;
    color: #44aaff;
    font-size: 10px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .history-toggle:hover {
    background: #44aaff22;
  }
  .history-list {
    max-height: 150px;
    overflow-y: auto;
    font-size: 10px;
  }
  .history-item {
    display: grid;
    grid-template-columns: 60px 1fr 1fr 1fr;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    margin-bottom: 4px;
    background: #1a1a1a;
  }
  .history-item:hover {
    background: #222222;
  }
  .history-time {
    color: #666666;
  }
  .history-value {
    color: #888888;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">⚡</div>
    <div>
      <div class="brand-name">Scooter Fleet</div>
      <div class="brand-sub">Fleet Management Dashboard</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="status-indicator">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Connecting...</span>
    </div>
  </div>
</div>

<div class="summary-section">
  <div class="summary-card">
    <div class="summary-label">Total Scooters</div>
    <div class="summary-value" id="summary-total">0</div>
  </div>
  <div class="summary-card">
    <div class="summary-label">Online</div>
    <div class="summary-value" id="summary-online" style="color: #44ff88;">0</div>
  </div>
  <div class="summary-card">
    <div class="summary-label">Avg Battery</div>
    <div class="summary-value" id="summary-battery">0%</div>
  </div>
  <div class="summary-card">
    <div class="summary-label">Locked</div>
    <div class="summary-value" id="summary-locked" style="color: #ff4444;">0</div>
  </div>
</div>
<div class="chart-section">
  <div class="chart-header">
    <div class="chart-title">Battery Levels</div>
  </div>
  <canvas id="batteryChart" height="200"></canvas>
</div>
<div class="fleet-grid" id="fleet"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  const SERVER = '';  // empty = same host
  let batteryChart = null;

  function batteryColor(pct) {
    if (pct > 50) return '#44ff88';
    if (pct > 20) return '#ffcc00';
    return '#ff4444';
  }

  function batteryClass(pct) {
    if (pct > 50) return 'green';
    if (pct > 20) return 'yellow';
    return 'red';
  }

  function timeSince(ts) {
    const sec = Math.floor((Date.now() - ts) / 1000);
    if (sec < 5)  return 'just now';
    if (sec < 60) return sec + 's ago';
    return Math.floor(sec / 60) + 'm ago';
  }

  function initChart() {
    const ctx = document.getElementById('batteryChart').getContext('2d');
    batteryChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: [],
        datasets: [{
          label: 'Battery %',
          data: [],
          backgroundColor: [],
          borderRadius: 4,
          borderSkipped: false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            grid: {
              color: '#2a2a2a'
            },
            ticks: {
              color: '#666666'
            }
          },
          x: {
            grid: {
              display: false
            },
            ticks: {
              color: '#666666'
            }
          }
        }
      }
    });
  }

  function updateChart(fleet) {
    if (!batteryChart) return;

    const ids = Object.keys(fleet);
    batteryChart.data.labels = ids;
    batteryChart.data.datasets[0].data = ids.map(id => fleet[id].battery || 0);
    batteryChart.data.datasets[0].backgroundColor = ids.map(id => batteryColor(fleet[id].battery || 0));
    batteryChart.update();
  }

  function sendCommand(id, action) {
    fetch(SERVER + '/command/' + id, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action })
    }).catch(e => console.log(e));
  }

  function toggleHistory(id) {
    const historyDiv = document.getElementById('history-' + id);
    const button = event.target;

    if (historyDiv.style.display === 'none') {
      historyDiv.style.display = 'block';
      button.textContent = 'Hide';
      fetchHistory(id);
    } else {
      historyDiv.style.display = 'none';
      button.textContent = 'Show';
    }
  }

  function fetchHistory(id) {
    fetch(SERVER + '/history/' + id)
      .then(r => r.json())
      .then(data => {
        const historyDiv = document.getElementById('history-' + id);
        const history = data.history || [];

        // Keep the header row
        let html = `
          <div class="history-item">
            <div class="history-time">Time</div>
            <div class="history-value">Battery</div>
            <div class="history-value">Speed</div>
            <div class="history-value">Mode</div>
          </div>
        `;

        // Add history entries (most recent first)
        history.slice().reverse().forEach(entry => {
          const time = new Date(entry.timestamp).toLocaleTimeString();
          html += `
            <div class="history-item">
              <div class="history-time">${time}</div>
              <div class="history-value">${entry.battery || 0}%</div>
              <div class="history-value">${(entry.speed || 0).toFixed(1)} mph</div>
              <div class="history-value">${entry.mode || '--'}</div>
            </div>
          `;
        });

        historyDiv.innerHTML = html;
      })
      .catch(e => console.log(e));
  }

  function renderScooter(id, d) {
    const bpct = d.battery || 0;
    const online = d.online;

    return `
    <div class="scooter-card ${online ? '' : 'offline'}">
      <div class="card-header">
        <div class="scooter-id">${id}</div>
        <div class="status-badge ${online ? 'online' : 'offline'}">
          ${online ? 'Online' : 'Offline'}
        </div>
      </div>

      <div class="telemetry-grid">
        <div class="tel-item">
          <div class="tel-label">Speed</div>
          <div class="tel-value white">${(d.speed || 0).toFixed(1)}</div>
          <div class="tel-unit">mph</div>
        </div>
        <div class="tel-item">
          <div class="tel-label">Battery</div>
          <div class="tel-value ${batteryClass(bpct)}">${bpct.toFixed(0)}</div>
          <div class="tel-unit">%</div>
        </div>
        <div class="tel-item">
          <div class="tel-label">Mode</div>
          <div class="tel-value yellow">${d.mode || '--'}</div>
          <div class="tel-unit">mode</div>
        </div>
        <div class="tel-item">
          <div class="tel-label">Voltage</div>
          <div class="tel-value blue">${(d.voltage || 0).toFixed(1)}</div>
          <div class="tel-unit">V</div>
        </div>
        <div class="tel-item">
          <div class="tel-label">Power</div>
          <div class="tel-value ${d.power ? 'green' : 'red'}">${d.power ? 'ON' : 'OFF'}</div>
          <div class="tel-unit">state</div>
        </div>
        <div class="tel-item">
          <div class="tel-label">Brake</div>
          <div class="tel-value ${d.brake ? 'red' : 'green'}">${d.brake ? 'ON' : 'OFF'}</div>
          <div class="tel-unit">state</div>
        </div>
        <div class="tel-item">
          <div class="tel-label">Light</div>
          <div class="tel-value ${d.light ? 'yellow' : 'white'}">${d.light ? 'ON' : 'OFF'}</div>
          <div class="tel-unit">light</div>
        </div>
      </div>

      <div class="battery-bar">
        <div class="battery-fill" style="width:${bpct}%; background:${batteryColor(bpct)}"></div>
      </div>

      <div class="controls">
        <button class="btn danger full ${d.brake ? 'active-red' : ''}" onclick="sendCommand('${id}','brakeOn')">
          <div class="btn-icon">🔒</div>Lock / Brake ON
        </button>
        <button class="btn success full ${!d.brake ? 'active-green' : ''}" onclick="sendCommand('${id}','brakeOff')">
          <div class="btn-icon">🔓</div>Unlock / Brake OFF
        </button>
        <button class="btn yellow" onclick="sendCommand('${id}','mode')">
          <div class="btn-icon">⚡</div>Cycle Mode
        </button>
        <button class="btn blue ${d.light ? 'active-yellow' : ''}" onclick="sendCommand('${id}','light')">
          <div class="btn-icon">💡</div>Toggle Light
        </button>
        <button class="btn" onclick="sendCommand('${id}','walk')">
          <div class="btn-icon">🚶</div>Walk Mode
        </button>
        <button class="btn danger ${d.power ? 'active-green' : 'active-red'}" onclick="sendCommand('${id}','power')">
          <div class="btn-icon">⏻</div>Power ON/OFF
        </button>
      </div>

      <div class="last-seen">Last seen: ${timeSince(d.lastSeen)}</div>

      <div class="history-section">
        <div class="history-header">
          <div class="history-title">History</div>
          <button class="history-toggle" onclick="toggleHistory('${id}')">Show</button>
        </div>
        <div class="history-list" id="history-${id}" style="display: none;">
          <div class="history-item">
            <div class="history-time">Time</div>
            <div class="history-value">Battery</div>
            <div class="history-value">Speed</div>
            <div class="history-value">Mode</div>
          </div>
        </div>
      </div>
    </div>`;
  }

  function fetchFleet() {
    fetch(SERVER + '/fleet')
      .then(r => r.json())
      .then(fleet => {
        const container = document.getElementById('fleet');
        const ids = Object.keys(fleet);

        // Update status indicator
        document.getElementById('status-dot').classList.remove('offline');
        document.getElementById('status-text').textContent = 'Live';

        // Update summary statistics
        const total = ids.length;
        const online = ids.filter(id => fleet[id].online).length;
        const batteries = ids.map(id => fleet[id].battery || 0);
        const avgBattery = batteries.length > 0 ? (batteries.reduce((a, b) => a + b, 0) / batteries.length).toFixed(0) : 0;
        const locked = ids.filter(id => fleet[id].brake).length;

        document.getElementById('summary-total').textContent = total;
        document.getElementById('summary-online').textContent = online;
        document.getElementById('summary-battery').textContent = avgBattery + '%';
        document.getElementById('summary-locked').textContent = locked;

        // Update battery chart
        updateChart(fleet);

        if (ids.length === 0) {
          container.innerHTML = '<div class="no-scooters">No scooters connected yet</div>';
          return;
        }

        container.innerHTML = ids
          .map(id => renderScooter(id, fleet[id]))
          .join('');
      })
      .catch(() => {
        document.getElementById('fleet').innerHTML =
          '<div class="no-scooters">Cannot reach server</div>';
        document.getElementById('status-dot').classList.add('offline');
        document.getElementById('status-text').textContent = 'Offline';
      });
  }

  setInterval(fetchFleet, 1000);
  fetchFleet();
  initChart();
</script>
</body>
</html>
